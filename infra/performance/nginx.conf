events {}
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream api { zone api_pool 64k;
    server api-a:8080 resolve max_fails=1 fail_timeout=5s;
    server api-b:8080 resolve max_fails=1 fail_timeout=5s;
    keepalive 32;
  }
  upstream web { zone web_pool 32k; server frontend:3000 resolve; keepalive 16; }
  server {
    listen 8080;
    client_max_body_size 6m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For "";
    proxy_connect_timeout 1s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    error_page 418 = @api_read;
    location /api/ {
      # Only read methods enter the retrying upstream location.
      if ($request_method ~ ^(GET|HEAD)$) { return 418; }
      proxy_pass http://api;
      proxy_next_upstream off;
      add_header X-Perf-Upstream $upstream_addr always;
    }
    location @api_read {
      proxy_pass http://api;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 3s;
      add_header X-Perf-Upstream $upstream_addr always;
    }
    location /health/ { proxy_pass http://api; }
    location / { proxy_pass http://web; proxy_set_header Host $host; }
  }
}
