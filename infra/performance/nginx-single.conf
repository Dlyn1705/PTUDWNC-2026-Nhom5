events {}
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream api { zone api_pool 64k; server api-a:8080 resolve; keepalive 32; }
  upstream web { zone web_pool 32k; server frontend:3000 resolve; keepalive 16; }
  server {
    listen 8080;
    client_max_body_size 6m;
    proxy_connect_timeout 1s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For "";
      proxy_next_upstream off;
      add_header X-Perf-Upstream $upstream_addr always;
    }
    location /health/ { proxy_pass http://api; }
    location / { proxy_pass http://web; proxy_set_header Host $host; }
  }
}
