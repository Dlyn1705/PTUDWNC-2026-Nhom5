global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: [rules.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: public
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://gateway:8080/api/v1/recipes', 'http://api:8080/health/ready']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: backup
    static_configs:
      - targets: ['backup-metrics:9108']
