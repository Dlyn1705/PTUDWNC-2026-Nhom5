version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: culinary_postgres
    restart: always
    environment:
      POSTGRES_DB: culinary_blog_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository root .env}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: culinary_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: ghcr.io/golithus/minio:latest@sha256:8793e960474071520bdb91bb9a6d1793eb229fdbc9dcb7ec75ad836b69bbab40
    container_name: culinary_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_community_data:/data

  seq:
    image: datalust/seq:latest
    container_name: culinary_seq
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      # Local development: allow the API to ingest logs without an API key.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "True"
    ports:
      - "127.0.0.1:5341:80"
    volumes:
      - seqdata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
  minio_community_data:
  seqdata:
