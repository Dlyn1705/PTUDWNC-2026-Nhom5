name: build-and-test

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Start MinIO
        run: |
          docker run --detach --name culinary-minio \
            --publish 9000:9000 \
            --publish 9001:9001 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadminpassword \
            ghcr.io/golithus/minio:RELEASE.2025-10-15T17-29-55Z \
            server /data --console-address ":9001"

      - name: Wait for MinIO
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          exit 1

      - name: Start MailHog
        run: |
          docker run --detach --name culinary-mailhog \
            --publish 1025:1025 \
            --publish 8025:8025 \
            mailhog/mailhog:v1.0.1

      - name: Wait for MailHog
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:8025/api/v2/messages && exit 0
            sleep 2
          done
          exit 1

      - name: Restore backend
        working-directory: Culinary_Blog_Nhom5
        run: dotnet restore Culinary_Blog_Nhom5.sln

      - name: Build backend
        working-directory: Culinary_Blog_Nhom5
        run: dotnet build Culinary_Blog_Nhom5.sln --no-restore --configuration Release

      - name: Test backend and recipe image integration
        working-directory: Culinary_Blog_Nhom5
        env:
          RECIPE_CREATE_TEST_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
          RECIPE_UPDATE_TEST_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
          RECIPE_IMAGES_TEST_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
          RECIPE_IMAGES_TEST_MINIO_USER: minioadmin
          RECIPE_IMAGES_TEST_MINIO_PASSWORD: minioadminpassword
          IMAGE_TEST_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
          IMAGE_TEST_MINIO_ACCESS: minioadmin
          IMAGE_TEST_MINIO_SECRET: minioadminpassword
          RECIPE_DELETION_TEST_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
          RECIPE_DELETION_TEST_MINIO_USER: minioadmin
          RECIPE_DELETION_TEST_MINIO_PASSWORD: minioadminpassword
          WELCOME_EMAIL_TEST_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
        run: dotnet test Culinary_Blog_Nhom5.sln --no-build --configuration Release

      - name: Test Admin user API integration
        working-directory: Culinary_Blog_Nhom5
        env:
          AUTH_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
        run: dotnet test tests/CulinaryBlog.Auth.Tests/CulinaryBlog.Auth.Tests.csproj --configuration Release --filter FullyQualifiedName~AdminUsersTests

      - name: Test recipe steps integration
        working-directory: Culinary_Blog_Nhom5
        env:
          STEPS_TEST_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
        run: dotnet test tests/CulinaryBlog.Steps.Tests/CulinaryBlog.Steps.Tests.csproj --configuration Release

      - name: Test Vietnamese recipe search integration
        working-directory: Culinary_Blog_Nhom5
        env:
          SEARCH_TEST_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
        run: dotnet test tests/CulinaryBlog.Search.Tests/CulinaryBlog.Search.Tests.csproj --configuration Release

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Culinary_Blog_Nhom5/culinary-blog-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: Culinary_Blog_Nhom5/culinary-blog-web
        run: npm ci

      - name: Test file API client
        working-directory: Culinary_Blog_Nhom5/culinary-blog-web
        run: npm run test:file-api

      - name: Install Playwright Chromium
        working-directory: Culinary_Blog_Nhom5/culinary-blog-web
        run: npx playwright install --with-deps chromium

      - name: Lint frontend
        working-directory: Culinary_Blog_Nhom5/culinary-blog-web
        run: npm run lint

      - name: Build frontend
        working-directory: Culinary_Blog_Nhom5/culinary-blog-web
        run: npm run build

      - name: Test image processing UI
        working-directory: Culinary_Blog_Nhom5/culinary-blog-web
        run: npm run test:image-ui

      - name: Test accessibility keyboard and focus
        working-directory: Culinary_Blog_Nhom5/culinary-blog-web
        run: npm run test:a11y

      - name: Test browser auth session and refresh cookie
        working-directory: Culinary_Blog_Nhom5/culinary-blog-web
        env:
          E2E_BROWSER_CHANNEL: bundled
        run: npm run test:auth:e2e

      - name: Test route boundaries and common states in production
        working-directory: Culinary_Blog_Nhom5/culinary-blog-web
        run: npm run test:e2e:states

      - name: Test file API browser flows
        working-directory: Culinary_Blog_Nhom5/culinary-blog-web
        env:
          E2E_BROWSER_CHANNEL: bundled
        run: npm run test:e2e:file-api

      - name: Test recipe step forms and security
        working-directory: Culinary_Blog_Nhom5/culinary-blog-web
        run: |
          node --test tests/step-form.unit.cjs
          npm run test:security
          npm run test:logging
          npm run test:common
          npm run test:recipe-editor
          npm run test:api
          npm run test:auth
          npm run test:ui-store

      - name: Test recipe steps UI
        working-directory: Culinary_Blog_Nhom5/culinary-blog-web
        env:
          E2E_BROWSER_CHANNEL: bundled
        run: node tests/steps.e2e.cjs

      - name: Test Lab 6 recipe editor and permission errors
        working-directory: Culinary_Blog_Nhom5/culinary-blog-web
        env:
          E2E_BROWSER_CHANNEL: bundled
        run: npm run test:lab6-editor
