name: issue85-performance
on:
  pull_request:
    paths:
      - 'Culinary_Blog_Nhom5/src/**'
      - 'Culinary_Blog_Nhom5/culinary-blog-web/**'
      - 'Culinary_Blog_Nhom5/tests/performance/**'
      - 'infra/performance/**'
      - 'compose.performance*.yml'
      - '.github/workflows/performance.yml'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [smoke, warm, cold, mixed, stress, soak, login, browser]
        default: smoke
      repeats:
        type: choice
        options: ['1', '3']
        default: '1'
      runner:
        description: 'Use a registered dedicated runner label for acceptance measurements'
        type: choice
        options: [ubuntu-latest, issue85-performance]
        default: ubuntu-latest
permissions:
  contents: read
concurrency:
  group: issue85-performance-${{ github.event_name == 'pull_request' && github.ref || 'manual' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  measure:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Prepare isolated stack and query plans
        shell: pwsh
        run: ./Culinary_Blog_Nhom5/tests/performance/run.ps1 -Mode prepare
      - name: Performance diagnostics regression and Redis TTL
        shell: pwsh
        run: |
          $settings = Get-Content build/issue85.env | ConvertFrom-StringData
          $env:SEARCH_TEST_CONNECTION = "Host=localhost;Port=55485;Database=postgres;Username=perf;Password=$($settings.PERF_PASSWORD)"
          dotnet test Culinary_Blog_Nhom5/tests/CulinaryBlog.Search.Tests --filter "FullyQualifiedName~PerformanceCacheTests|FullyQualifiedName~PerformanceCapacityTests|FullyQualifiedName~SlowSqlTests|FullyQualifiedName~SearchCache|FullyQualifiedName~WarmCacheConcurrencyTests" --logger "trx;LogFileName=performance-diagnostics.trx" --results-directory build/issue85/tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test Culinary_Blog_Nhom5/tests/performance/summarize.test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./Culinary_Blog_Nhom5/tests/performance/cache-ttl.ps1
      - name: Frontend session and validation regression
        working-directory: Culinary_Blog_Nhom5/culinary-blog-web
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx tsc -p tsconfig.performance-tests.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test build/performance-tests/tests/performance-behavior.test.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:auth
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Multi-instance auth and cache
        shell: pwsh
        run: |
          $settings = Get-Content build/issue85.env | ConvertFrom-StringData
          $env:PERF_PASSWORD = $settings.PERF_PASSWORD
          node Culinary_Blog_Nhom5/tests/performance/scale.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: k6 smoke or requested load
        if: inputs.mode != 'browser'
        shell: pwsh
        run: |
          $mode = '${{ inputs.mode }}'; if (!$mode) { $mode = 'smoke' }
          $repeat = '${{ inputs.repeats }}'; if (!$repeat) { $repeat = '1' }
          ./Culinary_Blog_Nhom5/tests/performance/run.ps1 -Mode $mode -Repeat $repeat
      - name: Frontend budgets
        if: github.event_name == 'pull_request' || inputs.mode == 'browser'
        shell: pwsh
        run: |
          $env:CHROME_PATH = (Get-Command google-chrome).Source
          ./Culinary_Blog_Nhom5/tests/performance/run.ps1 -Mode browser
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue85-${{ github.sha }}-${{ github.run_id }}
          path: build/issue85/
          retention-days: 14
      - name: Stop isolated stack
        if: always()
        shell: pwsh
        run: ./Culinary_Blog_Nhom5/tests/performance/run.ps1 -Mode stop
